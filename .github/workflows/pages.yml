name: Deploy Slice the Rot
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:decks
      - run: npm run build -- --base=/First-Year-hackKing-s-winning-project/
        env:
          # Demo: preloads the job-spec key so the live site never asks for one. It ends up readable in
          # the public bundle, so rotate the key after the demo (or delete the secret and redeploy).
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
